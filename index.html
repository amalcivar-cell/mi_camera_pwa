<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoreo Cam 3</title>
    
    <!-- Meta etiquetas críticas para PWA e iOS (Safari) -->
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitor Cam3">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Vinculación del Manifiesto PWA -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --online-color: #4caf50;
            --offline-color: #ff5252;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra de estado superior optimizada para notch/isla dinámica */
        .app-header {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid #222;
        }

        .cam-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #ffb300;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 179, 0, 0.5);
        }

        /* Contenedor de video a pantalla completa */
        .video-viewport {
            flex: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-viewport img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Evita deformaciones en cualquier pantalla móvil */
        }

        /* Pantalla de error responsiva */
        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            z-index: 5;
        }

        .error-overlay p {
            color: var(--offline-color);
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .btn-retry {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <span class="cam-title" id="camTitle">Cámara 3</span>
        <div class="status-container">
            <div class="status-dot" id="statusDot"></div>
        </div>
    </div>

    <div class="video-viewport">
        <!-- Solo cargamos la URL de la Cámara 3 -->
        <img id="camStream" alt="Iniciando transmisión..." onload="handleLoad()" onerror="handleError()">
        
        <div class="error-overlay" id="errorOverlay">
            <p>Transmisión interrumpida</p>
            <button class="btn-retry" onclick="forceRetry()">Reconectar ahora</button>
        </div>
    </div>

    <script>
        // Configuración fija de la Cámara 3
        const CAM_URL = "http://86.63.39.58:8080/axis-cgi/mjpg/video.cgi?camera=3&resolution=640x480&fps=15";
        const imgElement = document.getElementById('camStream');
        const dot = document.getElementById('statusDot');
        const errorOverlay = document.getElementById('errorOverlay');
        let reconnectTimer = null;

        // Iniciar carga original
        imgElement.src = CAM_URL;

        function handleLoad() {
            errorOverlay.style.display = 'none';
            dot.style.backgroundColor = 'var(--online-color)';
            dot.style.boxShadow = '0 0 8px rgba(76, 175, 80, 0.7)';
            if (reconnectTimer) {
                clearInterval(reconnectTimer);
                reconnectTimer = null;
            }
        }

        function handleError() {
            errorOverlay.style.display = 'flex';
            dot.style.backgroundColor = 'var(--offline-color)';
            dot.style.boxShadow = '0 0 8px rgba(255, 82, 82, 0.7)';
            
            if (!reconnectTimer) {
                reconnectTimer = setInterval(forceRetry, 4000); // Intento automático cada 4 segundos
            }
        }

        function forceRetry() {
            // Se añade el timestamp para romper la caché agresiva de Safari móvil
            imgElement.src = `${CAM_URL}?t=${new Date().getTime()}`;
        }

        // Registro del Service Worker obligatorio para funcionamiento PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Service Worker Activo'))
                    .catch(err => console.error('Error al registrar SW:', err));
            });
        }
    </script>
</body>
</html>
