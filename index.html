<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoreo Cam 3</title>
    
    <!-- Meta etiquetas PWA para Android e iOS -->
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitor Cam3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #0c0c0c;
            --text-color: #ffffff;
            --online-color: #4caf50;
            --offline-color: #ff5252;
            --loading-color: #ffb300;
            --primary-blue: #007aff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background-color: rgba(20, 20, 20, 0.95);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid #222;
        }

        .cam-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #555555;
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .video-viewport {
            flex: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-viewport img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(12, 12, 12, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        .overlay-screen p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 25px 0;
            max-width: 300px;
            color: #b3b3b3;
        }

        .btn-action {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-action:active {
            background-color: #0063cc;
        }

        .proxy-info {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <span class="cam-title">Cámara 3 (Vía Proxy Seguro)</span>
        <div class="status-container">
            <div class="status-dot" id="statusDot"></div>
        </div>
    </div>

    <div class="video-viewport">
        <img id="camStream" alt="Transmisión de video protegida">
        
        <div class="overlay-screen" id="controlOverlay">
            <p id="overlayMessage">Presiona el botón para iniciar la transmisión cifrada y segura en tu celular.</p>
            <button class="btn-action" id="overlayBtn" onclick="startSecureStream()">Ver Cámara</button>
            <div class="proxy-info" id="proxyRoute">Ruta: Buscando canal seguro...</div>
        </div>
    </div>

    <script>
        // Dirección IP original en HTTP
        const ORIGINAL_URL = "http://109.247.15.178:6001/mjpg/video.mjpg";
        
        // Listado de Proxies de respaldo (Pasan el tráfico de HTTP a HTTPS de forma automática)
        const PROXIES = [
            `https://weserv.nl{encodeURIComponent(ORIGINAL_URL.replace('http://', ''))}&default=${encodeURIComponent(ORIGINAL_URL)}`,
            `https://herokuapp.com{ORIGINAL_URL}`,
            ORIGINAL_URL // Último recurso (Caída directa)
        ];

        let currentProxyIndex = 0;
        const imgElement = document.getElementById('camStream');
        const dot = document.getElementById('statusDot');
        const overlay = document.getElementById('controlOverlay');
        const overlayMessage = document.getElementById('overlayMessage');
        const overlayBtn = document.getElementById('overlayBtn');
        const proxyRoute = document.getElementById('proxyRoute');

        imgElement.onload = handleSuccess;
        imgElement.onerror = handleFailure;

        function startSecureStream() {
            overlayMessage.textContent = "Estableciendo conexión por túnel SSL...";
            overlayBtn.style.display = "none";
            dot.style.backgroundColor = 'var(--loading-color)';
            
            tryConnect();
        }

        function tryConnect() {
            const secureUrl = PROXIES[currentProxyIndex];
            
            // Mostrar informativamente en pantalla qué canal está intentando usar el celular
            if (currentProxyIndex === 0) proxyRoute.textContent = "Canal Principal: Weserv TLS Gateway";
            else if (currentProxyIndex === 1) proxyRoute.textContent = "Canal de Respaldo: CORS-Anywhere Bridge";
            else proxyRoute.textContent = "Conexión directa (Sujeta a políticas del terminal)";

            imgElement.src = "";
            imgElement.src = secureUrl;
        }

        function handleSuccess() {
            overlay.style.display = 'none';
            imgElement.style.display = 'block';
            dot.style.backgroundColor = 'var(--online-color)';
            dot.style.boxShadow = '0 0 10px rgba(76, 175, 80, 0.8)';
        }

        function handleFailure() {
            // Si el proxy actual falla o es bloqueado, salta automáticamente al siguiente de la lista
            if (currentProxyIndex < PROXIES.length - 1) {
                currentProxyIndex++;
                setTimeout(tryConnect, 1500); // Espera un segundo e intenta por la vía alternativa
            } else {
                // Si todos los canales fallan por completo
                imgElement.style.display = 'none';
                overlay.style.display = 'flex';
                overlayMessage.innerHTML = "<span style='color:var(--offline-color)'>Error crítico de red. El celular no tolera el certificado de la cámara.</span>";
                overlayBtn.textContent = "Reintentar Canales";
                overlayBtn.style.display = "block";
                currentProxyIndex = 0; // Reinicia el ciclo
                
                dot.style.backgroundColor = 'var(--offline-color)';
                dot.style.boxShadow = '0 0 10px rgba(255, 82, 82, 0.8)';
            }
        }
    </script>
</body>
</html>
