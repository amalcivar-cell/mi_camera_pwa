<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoreo Cam 3</title>
    
    <!-- Directiva de seguridad para forzar compatibilidad -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <!-- Meta etiquetas PWA para Android e iOS (Safari) -->
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitor Cam3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #0c0c0c;
            --text-color: #ffffff;
            --online-color: #4caf50;
            --offline-color: #ff5252;
            --loading-color: #ffb300;
            --primary-blue: #007aff; /* Azul nativo estilo iOS/Android para acciones */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background-color: rgba(20, 20, 20, 0.95);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid #222;
        }

        .cam-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #555555; /* Gris por defecto antes de conectar */
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .video-viewport {
            flex: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-viewport img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none; /* Oculto hasta que se autorice */
        }

        /* CAPA DE AUTORIZACIÓN INICIAL E INTERRUPCIÓN */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(12, 12, 12, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        .overlay-screen p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 25px 0;
            max-width: 300px;
            color: #b3b3b3;
        }

        .overlay-screen p.error-text {
            color: var(--offline-color);
        }

        .btn-action {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-action:active {
            transform: scale(0.96);
            background-color: #0063cc;
        }

        .btn-action.retry-mode {
            background-color: #222;
            border: 1px solid #444;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <span class="cam-title">Cámara de Seguridad 3</span>
        <div class="status-container">
            <div class="status-dot" id="statusDot"></div>
        </div>
    </div>

    <div class="video-viewport">
        <img id="camStream" alt="Transmisión de video en vivo">
        
        <!-- Pantalla de control dinámica (Sirve para Autorizar y para Errores) -->
        <div class="overlay-screen" id="controlOverlay">
            <p id="overlayMessage">Se requiere tu autorización explícita para abrir el flujo de seguridad en este dispositivo móvil.</p>
            <button class="btn-action" id="overlayBtn" onclick="authorizeStream()">Autorizar Transmisión</button>
        </div>
    </div>

    <script>
        const TRANSMISSION_URL = "http://109.247.15.178:6001/mjpg/video.mjpg";
        
        const imgElement = document.getElementById('camStream');
        const dot = document.getElementById('statusDot');
        const overlay = document.getElementById('controlOverlay');
        const overlayMessage = document.getElementById('overlayMessage');
        const overlayBtn = document.getElementById('overlayBtn');
        
        let reconnectInterval = null;
        let hasBeenAuthorized = false;

        // Registro de eventos nativos
        imgElement.onload = handleSuccess;
        imgElement.onerror = handleFailure;

        // FUNCIÓN DE AUTORIZACIÓN (Se ejecuta por la acción del usuario)
        function authorizeStream() {
            hasBeenAuthorized = true;
            
            // Cambiar estados visuales de carga
            overlayMessage.textContent = "Conectando al flujo proxy...";
            overlayBtn.style.display = "none";
            dot.style.backgroundColor = 'var(--loading-color)';
            dot.style.boxShadow = '0 0 10px rgba(255, 179, 0, 0.6)';
            
            // Ejecutar la petición del flujo multimedia
            executeStream();
        }

        function executeStream() {
            imgElement.src = ""; 
            imgElement.src = TRANSMISSION_URL;
        }

        function handleSuccess() {
            if (!hasBeenAuthorized) return;

            // Ocultar capa de bloqueo y mostrar el visor de video
            overlay.style.display = 'none';
            imgElement.style.display = 'block';
            
            dot.style.backgroundColor = 'var(--online-color)';
            dot.style.boxShadow = '0 0 10px rgba(76, 175, 80, 0.8)';
            
            if (reconnectInterval) {
                clearInterval(reconnectInterval);
                reconnectInterval = null;
            }
        }

        function handleFailure() {
            // Si el usuario no ha intentado conectar aún, ignorar errores iniciales de carga de etiqueta
            if (!hasBeenAuthorized) return; 

            imgElement.style.display = 'none';
            overlay.style.display = 'flex';
            
            // Reconfigurar la interfaz para modo error / reintento manual
            overlayMessage.innerHTML = `<span class="error-text">La transmisión se interrumpió o el navegador bloqueó el tráfico inseguro de la cámara IP.</span>`;
            overlayBtn.textContent = "Forzar Nueva Conexión";
            overlayBtn.className = "btn-action retry-mode";
            overlayBtn.style.display = "block";
            
            dot.style.backgroundColor = 'var(--offline-color)';
            dot.style.boxShadow = '0 0 10px rgba(255, 82, 82, 0.8)';
            
            // Intento de reconexión cíclico cada 7 segundos en segundo plano
            if (!reconnectInterval) {
                reconnectInterval = setInterval(executeStream, 7000);
            }
        }

        // Service Worker básico para cumplimiento de PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
