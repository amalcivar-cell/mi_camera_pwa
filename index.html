<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoreo Cam 3</title>
    
    <!-- DIRECTIVA DE SEGURIDAD CRÍTICA PARA GITHUB PAGES (HTTPS -> HTTP) -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <!-- Meta etiquetas de optimización para PWA e iOS (Safari) -->
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitor Cam3">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Enlace al archivo de configuración de la app móvil -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --online-color: #4caf50;
            --offline-color: #ff5252;
            --loading-color: #ffb300;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Encabezado optimizado para pantallas con notch e islas dinámicas */
        .app-header {
            background-color: rgba(20, 20, 20, 0.95);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid #222;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .cam-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: var(--loading-color);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 179, 0, 0.6);
            transition: all 0.4s ease;
        }

        /* Contenedor adaptativo de transmisión a pantalla completa */
        .video-viewport {
            flex: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-viewport img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la proporción nativa en vertical u horizontal */
            display: block;
        }

        /* Panel de error interactivo en móviles */
        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            display: none;
            z-index: 5;
        }

        .error-overlay p {
            color: var(--offline-color);
            margin: 0 0 20px 0;
            font-size: 1.1rem;
            line-height: 1.5;
            max-width: 280px;
        }

        .btn-retry {
            background-color: #1f1f1f;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 0.2px;
            transition: background-color 0.2s;
            -webkit-tap-highlight-color: transparent; /* Elimina parpadeo azul en iOS */
        }
        
        .btn-retry:active {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <span class="cam-title">Cámara de Seguridad 3</span>
        <div class="status-container">
            <div class="status-dot" id="statusDot"></div>
        </div>
    </div>

    <div class="video-viewport">
        <!-- El elemento inicia vacío para ser controlado exclusivamente por JS -->
        <img id="camStream" alt="Conectando con el servidor de la cámara...">
        
        <div class="error-overlay" id="errorOverlay">
            <p>Conexión interrumpida o bloqueada por políticas de red móvil.</p>
            <button class="btn-retry" onclick="forceRetry()">Forzar Conexión</button>
        </div>
    </div>

    <script>
        // Enlace original a la transmisión MJPEG
        const TRANSMISSION_URL = "http://109.247.15.178:6001/mjpg/video.mjpg";
        
        const imgElement = document.getElementById('camStream');
        const dot = document.getElementById('statusDot');
        const errorOverlay = document.getElementById('errorOverlay');
        let autoReconnectInterval = null;

        // Registro semántico de eventos del ciclo de vida del stream
        imgElement.onload = handleLoadSuccess;
        imgElement.onerror = handleLoadError;

        // Arrancar la comunicación con la cámara ip
        startStream();

        function startStream() {
            // Se fuerza el vaciado del buffer de la imagen. 
            // Esto obliga a Safari/Chrome en celular a destruir el hilo HTTP anterior bloqueado.
            imgElement.src = ""; 
            imgElement.src = TRANSMISSION_URL;
        }

        function handleLoadSuccess() {
            errorOverlay.style.display = 'none';
            dot.style.backgroundColor = 'var(--online-color)';
            dot.style.boxShadow = '0 0 10px rgba(76, 175, 80, 0.8)';
            
            // Si hay un bucle de reconexión activo, se limpia
            if (autoReconnectInterval) {
                clearInterval(autoReconnectInterval);
                autoReconnectInterval = null;
            }
        }

        function handleLoadError() {
            errorOverlay.style.display = 'flex';
            dot.style.backgroundColor = 'var(--offline-color)';
            dot.style.boxShadow = '0 0 10px rgba(255, 82, 82, 0.8)';
            
            // Intento automático de limpieza y reconexión cada 6 segundos si se cae la señal
            if (!autoReconnectInterval) {
                autoReconnectInterval = setInterval(startStream, 6000);
            }
        }

        function forceRetry() {
            errorOverlay.style.display = 'none';
            dot.style.backgroundColor = 'var(--loading-color)';
            dot.style.boxShadow = '0 0 10px rgba(255, 179, 0, 0.6)';
            startStream();
        }

        // Registro seguro del Service Worker para el entorno PWA de GitHub Pages
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA preparado de forma correcta'))
                    .catch(err => console.log('Registro SW omitido en entorno de pruebas'));
            });
        }
    </script>
</body>
</html>
